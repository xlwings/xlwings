# No dlls, no built Excel files
name: Build any wheel

on:
  workflow_dispatch:

permissions: {}

jobs:
  build:
    name: Build any wheel
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.12"
      - name: Install Python dependencies
        run: python -m pip install wheel setuptools
      - name: Stamp version with commit hash
        run: |
          COMMIT_HASH=$(git rev-parse --short HEAD)
          sed -i "s/__version__ = \"0.0.0\"/__version__ = \"0.0.0+${COMMIT_HASH}\"/" xlwings/__init__.py
      - name: Build wheel
        env:
          BUILD_RUST: 0
        run: python setup.py bdist_wheel
      - name: Upload artifacts
        uses: actions/upload-artifact@v7.0.2
        with:
          name: any-wheel
          path: ./dist
