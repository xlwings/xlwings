name: Build pyemscripten wheel
description: >-
  Builds the PEP 783 pyemscripten wheel (Pyodide) with maturin. Expects the
  source tree (with versions stamped in xlwings/__init__.py and Cargo.toml) to
  be present in the workspace and leaves the wheel in ./dist.

inputs:
  python-version:
    description: CPython version of the targeted Pyodide release
    required: true

runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: ${{ inputs.python-version }}
    - name: Install pyodide-build
      shell: bash
      run: python -m pip install "pyodide-build==0.39.0"
    # pyodide-build knows the Emscripten version, Rust toolchain, rustflags and
    # platform tag that the targeted Pyodide release requires, see
    # https://pyodide.org/en/stable/development/abi.html
    - name: Get Pyodide build config
      id: pyodide-config
      shell: bash
      run: |
        echo "rust-toolchain=$(pyodide config get rust_toolchain)" >> "$GITHUB_OUTPUT"
        echo "emscripten-version=$(pyodide config get emscripten_version)" >> "$GITHUB_OUTPUT"
        echo "platform-version=$(pyodide config get pyemscripten_platform_version)" >> "$GITHUB_OUTPUT"
        echo "rustflags=$(pyodide config get rustflags)" >> "$GITHUB_OUTPUT"
        cat "$GITHUB_OUTPUT"
    - name: Set up Emscripten
      uses: emscripten-core/setup-emsdk@v16
      with:
        version: ${{ steps.pyodide-config.outputs.emscripten-version }}
        no-cache: true
    - name: Build pyemscripten wheel
      uses: PyO3/maturin-action@v1
      env:
        CARGO_TARGET_WASM32_UNKNOWN_EMSCRIPTEN_RUSTFLAGS: ${{ steps.pyodide-config.outputs.rustflags }}
        # Produces the PEP 783 platform tag pyemscripten_<year>_<patch>_wasm32
        MATURIN_PYEMSCRIPTEN_PLATFORM_VERSION: ${{ steps.pyodide-config.outputs.platform-version }}
      with:
        target: wasm32-unknown-emscripten
        rust-toolchain: ${{ steps.pyodide-config.outputs.rust-toolchain }}
        maturin-version: v1.15.0
        command: build
        args: --release --out dist --interpreter ${{ inputs.python-version }}
